# Tox automatiza el entrenamiento, las pruebas y el empaquetamiento del modelo.
# Instalación: pip install tox   (versión 4)
#   tox run -e train          -> entrena el modelo y guarda el pipeline
#   tox run -e test_package   -> entrena y ejecuta las pruebas

[tox]
min_version = 4
envlist = test_package
skipsdist = True

[testenv]
basepython = python
install_command = pip install {opts} {packages}
setenv =
	PYTHONPATH=.
	PYTHONHASHSEED=0

[testenv:test_package]
envdir = {toxworkdir}/test_package
deps =
	-rrequirements/test_requirements.txt
commands =
	python model/train_pipeline.py
	pytest -s -vv {posargs:tests/}

[testenv:train]
envdir = {toxworkdir}/test_package
deps =
	-rrequirements/test_requirements.txt
commands =
	python model/train_pipeline.py
