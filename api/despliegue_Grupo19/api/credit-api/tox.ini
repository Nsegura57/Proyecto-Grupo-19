# Automatiza pruebas y ejecución de la API.
#   tox run -e test_app   -> pruebas de la API
#   tox run -e run        -> levanta la API en el puerto 8001

[tox]
min_version = 4
envlist = test_app
skipsdist = True

[testenv]
basepython = python
install_command = pip install {opts} {packages}
passenv =
	PORT
setenv =
	PYTHONPATH=.
	PYTHONHASHSEED=0

[testenv:test_app]
envdir = {toxworkdir}/test_app
deps =
	-rtest_requirements.txt
commands =
	pytest -vv {posargs:tests/}

[testenv:run]
envdir = {toxworkdir}/test_app
deps =
	-rrequirements.txt
commands =
	uvicorn app.main:app --host 0.0.0.0 --port 8001
