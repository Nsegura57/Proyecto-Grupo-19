# Levanta API (8001) y tablero (8050). Uso:  docker compose up --build -d
services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: grupo19-api:1.0.0
    container_name: grupo19-api
    ports:
      - "8001:8001"
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: grupo19-dashboard:1.0.0
    container_name: grupo19-dashboard
    environment:
      API_URL: api          # nombre del servicio en la red de compose
      API_PORT: "8001"
    ports:
      - "8050:8050"
    depends_on:
      - api
    restart: unless-stopped
